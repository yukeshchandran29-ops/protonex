version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: protonex
      POSTGRES_PASSWORD: protonex
      POSTGRES_DB: protonex
    ports:
      - '5432:5432'
    volumes:
      - protonex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U protonex']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: protonex
      MINIO_ROOT_PASSWORD: protonex123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - protonex_minio:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://protonex:protonex@postgres:5432/protonex?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '8787:8787'

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: node dist/jobs/worker.js
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://protonex:protonex@postgres:5432/protonex?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  protonex_pgdata:
  protonex_minio:
